name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (ruff 版本固定，保证 format/check 门禁稳定)
        run: pip install ruff==0.16.8 pytest "aiohttp>=3.9.0"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
